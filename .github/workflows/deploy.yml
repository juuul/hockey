name: Deploy to GitHub Pages

# main -> hockey.juliaan.eu/ (live), test -> hockey.juliaan.eu/test/. Eigen domein via de CNAME van deze repo; juliaan.eu/hockey/ stuurt door. Pages heeft één site per repo, dus beide branches worden altijd samen gebouwd.
on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: test
          path: test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build live
        working-directory: live
        run: npm ci && npm run build
      - name: Build test
        working-directory: test
        run: npm ci && npm run build -- --mode test
      - name: Samenvoegen (live in root, test in /test/)
        run: |
          cp -r live/dist site
          cp -r test/dist site/test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
